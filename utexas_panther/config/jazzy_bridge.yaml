name: humble_to_jazzy_bridge
from_domain: 0
to_domain: 1

topics:

  # ── TF (Humble → Jazzy) ───────────────────────────────────────────────────
  tf:
    type: tf2_msgs/msg/TFMessage
  tf_static:
    type: tf2_msgs/msg/TFMessage

  # ── TF (Jazzy → Humble) ───────────────────────────────────────────────────
  tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 1
    to_domain: 0
  tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 1
    to_domain: 0

  # ── Odometry (Humble → Jazzy) ─────────────────────────────────────────────
  panther/odometry/filtered:
    type: nav_msgs/msg/Odometry
  panther/odometry/wheels:
    type: nav_msgs/msg/Odometry

  # ── IMU (Humble → Jazzy) ──────────────────────────────────────────────────
  panther/imu/data:
    type: sensor_msgs/msg/Imu

  # ── Joint states (Humble → Jazzy) ─────────────────────────────────────────
  panther/joint_states:
    type: sensor_msgs/msg/JointState
  panther/dynamic_joint_states:
    type: control_msgs/msg/DynamicJointState

  # ── Joint states (Jazzy → Humble) ─────────────────────────────────────────
  panther/joint_states:
    type: sensor_msgs/msg/JointState
    from_domain: 1
    to_domain: 0

  # ── Robot description (Humble → Jazzy) ───────────────────────────────────
  panther/robot_description:
    type: std_msgs/msg/String

  # ── Velocity commands (Jazzy → Humble) ───────────────────────────────────
  panther/cmd_vel_nav:
    type: geometry_msgs/msg/Twist
    from_domain: 1
    to_domain: 0
  panther/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 1
    to_domain: 0
  panther/controller/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 1
    to_domain: 0
  panther/hololens/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 1
    to_domain: 0
  panther/keyboard/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 1
    to_domain: 0

  # ── Navigation poses (Humble → Jazzy) ────────────────────────────────────
  goal_pose:
    type: geometry_msgs/msg/PoseStamped
  panther/goal_pose:
    type: geometry_msgs/msg/PoseStamped
  clicked_point:
    type: geometry_msgs/msg/PointStamped
  panther/localization/set_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped

  # ── Initial pose (bidirectional) ──────────────────────────────────────────
  initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
  initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 1
    to_domain: 0

  # ── E-stop (bidirectional) ────────────────────────────────────────────────
  panther/hardware/e_stop:
    type: std_msgs/msg/Bool
  panther/hardware/e_stop:
    type: std_msgs/msg/Bool
    from_domain: 1
    to_domain: 0

  # ── Battery (Humble → Jazzy) ──────────────────────────────────────────────
  panther/battery/battery_status:
    type: sensor_msgs/msg/BatteryState

  # ── Diagnostics (Humble → Jazzy) ─────────────────────────────────────────
  diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray
  panther/diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray

  # ── Joystick (Humble → Jazzy) ─────────────────────────────────────────────
  panther/joy:
    type: sensor_msgs/msg/Joy

  # ── Lights (Humble → Jazzy) ───────────────────────────────────────────────
  panther/lights/channel_1_frame:
    type: sensor_msgs/msg/Image
  panther/lights/channel_2_frame:
    type: sensor_msgs/msg/Image

  # ── Speed limit (Jazzy → Humble) ─────────────────────────────────────────
  panther/speed_limit:
    type: nav2_msgs/msg/SpeedLimit
    from_domain: 1
    to_domain: 0

  # ── REMOVED (require panther_msgs not available in Humble): ───────────────
  #   panther/hardware/io_state        panther_msgs/msg/IOState
  #   panther/hardware/motor_controllers_state  panther_msgs/msg/DriverState
  #   panther/battery/charging_status  panther_msgs/msg/ChargingStatus
  #   panther/system_status            panther_msgs/msg/SystemStatus