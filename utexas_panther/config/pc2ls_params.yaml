---
/**:
  pointcloud_to_laserscan:
    ros__parameters:
      use_sim_time: false
      min_height: -0.1
      max_height: 2.0
      angle_min: -3.14
      angle_max: 3.14
      angle_increment: 0.005
      scan_time: 0.1
      range_min: 0.3
      range_max: 50.0
      target_frame: "<namespace>/base_link"
      transform_tolerance: 0.1
      inf_epsilon: 1.0
      use_inf: true