---
/**:
  ### NAVIGATION ###
  bt_navigator:
    ros__parameters:
      use_sim_time: false
      global_frame: <namespace>/map
      robot_base_frame: <namespace>/base_link
      odom_topic: <namespace>/odometry/filtered
      plugin_lib_names:
        - is_estop
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_back_up_action_bt_node
        - nav2_spin_action_bt_node
        - nav2_wait_action_bt_node
        - nav2_clear_costmap_service_bt_node
        - nav2_is_stuck_condition_bt_node
        - nav2_goal_reached_condition_bt_node
        - nav2_goal_updated_condition_bt_node
        - nav2_initial_pose_received_condition_bt_node
        - nav2_reinitialize_global_localization_service_bt_node
        - nav2_rate_controller_bt_node
        - nav2_distance_controller_bt_node
        - nav2_speed_controller_bt_node
        - nav2_truncate_path_action_bt_node
        - nav2_goal_updater_node_bt_node
        - nav2_recovery_node_bt_node
        - nav2_pipeline_sequence_bt_node
        - nav2_round_robin_node_bt_node
        - nav2_transform_available_condition_bt_node
        - nav2_time_expired_condition_bt_node
        - nav2_distance_traveled_condition_bt_node
        - nav2_remove_passed_goals_action_bt_node
        - nav2_compute_path_through_poses_action_bt_node

  bt_navigator_navigate_through_poses_rclcpp_node:
    ros__parameters:
      use_sim_time: false

  bt_navigator_navigate_to_pose_rclcpp_node:
    ros__parameters:
      use_sim_time: false

  controller_server:
    ros__parameters:
      use_sim_time: false

      controller_frequency: 20.0
      odom_topic: <namespace>/odometry/filtered
      costmap_update_timeout: 0.5

      min_x_velocity_threshold: 0.01
      min_y_velocity_threshold: 0.01
      min_theta_velocity_threshold: 0.05
      failure_tolerance: 0.4
      use_realtime_priority: false

      # Progress checker parameters
      progress_checker_plugin: progress_checker
      progress_checker:
        movement_time_allowance: 10.0
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5

      # Goal checker parameters
      goal_checker_plugins: [goal_checker]
      goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: true
        xy_goal_tolerance: 1.5
        yaw_goal_tolerance: 3.14159

      # MPPI controller
      controller_plugins: [FollowPath]
      FollowPath:
        plugin: nav2_mppi_controller::MPPIController
        time_steps: 60
        model_dt: 0.05
        batch_size: 1200
        vx_std: 0.6
        vy_std: 0.0
        wz_std: 0.3
        vx_max: 1.0
        vx_min: -0.5
        vy_max: 0.0
        wz_max: 1.0
        iteration_count: 2
        prune_distance: 5.0
        transform_tolerance: 0.1
        temperature: 0.3
        gamma: 0.015
        motion_model: DiffDrive
        regenerate_noises: true
        visualize: false
        AckermannConstraints:
          min_turning_r: 0.05
        critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
        ConstraintCritic:
          enabled: false
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 3.2
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.1
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 7.0
          threshold_to_consider: 1.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          critical_cost: 200.0
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 1.0
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 8.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 1.0
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 3.2
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 1.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.5
          mode: 0
        # TwirlingCritic:
        #   enabled: true
        #   twirling_cost_power: 1
        #   twirling_cost_weight: 10.0

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: false

        global_frame: <namespace>/odom
        robot_base_frame: <namespace>/base_link
        transform_tolerance: 0.1

        update_frequency: 10.0
        publish_frequency: 5.0

        width: 15
        height: 15
        resolution: 0.04

        always_send_full_costmap: true
        rolling_window: true

        footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'

        plugins: [obstacle_layer, inflation_layer]
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.5
          inflation_radius: 2.0

        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
          map_topic: /<namespace>/map

        obstacle_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          observation_sources: <observation_topic_type>
          combination_method: 0
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 40
          unknown_threshold: 39
          mark_threshold: 0
          pointcloud:
            data_type: PointCloud2
            topic: <observation_topic>_filtered
            observation_persistence: 0.0
            expected_update_rate: 15.0
            marking: true
            clearing: true
            obstacle_max_range: 5.0
            raytrace_max_range: 6.5
            obstacle_min_range: 0.3
            raytrace_min_range: 0.3
            min_obstacle_height: 0.135
            max_obstacle_height: 2.0
            inf_is_valid: true
          laserscan:
            data_type: LaserScan
            topic: <scan_topic>
            marking: true
            clearing: true
            obstacle_max_range: 5.0
            raytrace_max_range: 6.5
            obstacle_min_range: 0.3
            raytrace_min_range: 0.3
            min_obstacle_height: 0.135
            max_obstacle_height: 2.0
            inf_is_valid: true


  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: false

        global_frame: <namespace>/map
        robot_base_frame: <namespace>/base_link
        transform_tolerance: 0.1

        update_frequency: 1.0
        publish_frequency: 1.0

        resolution: 0.05

        always_send_full_costmap: true
        track_unknown_space: true # if false, treats unknown space as free space, else as unknown space

        footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'

        plugins: [static_layer, obstacle_layer, inflation_layer]
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.5
          inflation_radius: 2.0
          inflate_around_unknown: false
          inflate_unknown: false
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
          map_topic: /<namespace>/map

        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: <observation_topic_type>
          pointcloud:
            data_type: PointCloud2
            topic: <observation_topic>_filtered
            marking: true
            clearing: true
            obstacle_max_range: 10.0
            raytrace_max_range: 12.0
            min_obstacle_height: 0.135
            max_obstacle_height: 2.0
            inf_is_valid: false
          laserscan:
            data_type: LaserScan
            topic: <scan_topic>
            marking: true
            clearing: true
            obstacle_max_range: 10.0
            raytrace_max_range: 12.0
            min_obstacle_height: 0.135
            max_obstacle_height: 2.0
            inf_is_valid: false


  planner_server:
    ros__parameters:
      use_sim_time: false
      expected_planner_frequency: 1.0

      planner_plugins: [GridBased]
      GridBased:
        plugin: nav2_smac_planner/SmacPlanner2D
        tolerance: 0.125
        downsample_costmap: true
        downsampling_factor: 2
        allow_unknown: true
        max_iterations: 2000000
        max_on_approach_iterations: 1000
        max_planning_time: 10.0
        cost_travel_multiplier: 2.5
        use_final_approach_orientation: false
        smoother:
          max_iterations: 500
          w_smooth: 0.2
          w_data: 0.2
          tolerance: 1.0e-6

  smoother_server:
    ros__parameters:
      use_sim_time: false

  behavior_server:
    ros__parameters:
      use_sim_time: false

      global_frame: <namespace>/odom
      robot_base_frame: <namespace>/base_link
      transform_tolerance: 0.1

      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0

      # FIX: was "recovery_plugins" which is the pre-Humble name; correct key is "behavior_plugins"
      behavior_plugins: [spin, backup, wait]
      spin:
        plugin: nav2_behaviors/Spin
      backup:
        plugin: nav2_behaviors/BackUp
      wait:
        plugin: nav2_behaviors/Wait

      # spin & backup
      simulate_ahead_time: 2.0

      # spin
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2


  waypoint_follower:
    ros__parameters:
      use_sim_time: false
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        waypoint_pause_duration: 0

  velocity_smoother:
    ros__parameters:
      use_sim_time: false
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity: [0.8, 0.0, 1.0]
      min_velocity: [-0.5, 0.0, -1.0]
      max_accel: [1.5, 0.0, 2.0]
      max_decel: [-1.5, 0.0, -2.0]
      odom_topic: <namespace>/odometry/filtered
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0

  ### LOCALIZATION ###

  amcl:
    ros__parameters:
      use_sim_time: false

      global_frame_id: <namespace>/map
      odom_frame_id: <namespace>/odom
      base_frame_id: <namespace>/base_link

      scan_topic: <scan_topic>

      robot_model_type: nav2_amcl::DifferentialMotionModel

      set_initial_pose: true
      always_reset_initial_pose: true
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0

      tf_broadcast: true
      transform_tolerance: 1.0

      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2

      do_beamskip: true
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3

      lambda_short: 0.1

      laser_model_type: likelihood_field
      laser_likelihood_max_dist: 3.0   # was 2.0
      laser_max_range: 50.0
      laser_min_range: 0.3

      max_beams: 180

      max_particles: 5000
      min_particles: 1000

      pf_err: 0.05
      pf_z: 0.99

      recovery_alpha_slow: 0.001   # was 0.0
      recovery_alpha_fast: 0.1     # was 0.0

      resample_interval: 1
      save_pose_rate: 0.5
      sigma_hit: 0.3

      update_min_a: 0.1
      update_min_d: 0.15

      z_hit: 0.45           # was 0.5
      z_rand: 0.49          # was 0.5
      z_max: 0.05
      z_short: 0.01         # was 0.05 — short returns less common with lidar outdoors

  ### MAP SERVER ###

  map_server:
    ros__parameters:
      use_sim_time: false
      yaml_filename: map.yaml
      frame_id: <namespace>/map

  map_autosaver:
    ros__parameters:
      use_sim_time: false
      autosave_period: 15.0
      map_directory: /map

  ### SLAM ###

  # FIX: was "<namespace>/slam_toolbox" which produces "panther/slam_toolbox" after substitution —
  # a slash in a /**:-scoped node name never matches the running node. Bare node name is correct.
  slam_toolbox:
    ros__parameters:
      # Plugin params
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None

      # ROS Parameters
      odom_frame: <namespace>/odom
      map_frame: <namespace>/map
      base_frame: <namespace>/base_link
      scan_topic: <scan_topic>
      mode: mapping

      debug_logging: false
      throttle_scans: 1
      transform_publish_period: 0.04
      map_update_interval: 1.0
      resolution: 0.05
      max_laser_range: 50.0
      min_laser_range: 0.3
      minimum_time_interval: 0.05
      transform_timeout: 0.5
      tf_buffer_duration: 20.0
      stack_size_to_use: 40000000
      enable_interactive_mode: false

      # General Parameters
      use_scan_matching: true
      use_scan_barycenter: true
      minimum_travel_distance: 0.2
      minimum_travel_heading: 0.1
      scan_buffer_size: 30
      scan_buffer_maximum_scan_distance: 10.0
      link_match_minimum_response_fine: 0.1
      link_scan_maximum_distance: 1.5
      loop_search_maximum_distance: 50.0
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance_coarse: 3.0
      loop_match_minimum_response_coarse: 0.35
      loop_match_minimum_response_fine: 0.55

      # Correlation Parameters
      correlation_search_space_dimension: 1.0
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1

      # Loop Closure Parameters
      loop_search_space_dimension: 15.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03

      # Scan Matcher Parameters
      distance_variance_penalty: 0.5
      angle_variance_penalty: 1.0
      fine_search_angle_offset: 0.00349
      coarse_search_angle_offset: 0.349
      coarse_angle_resolution: 0.0349
      minimum_angle_penalty: 0.9
      minimum_distance_penalty: 0.5
      use_response_expansion: true

      use_sim_time: false

  pointcloud_to_laserscan:
    ros__parameters:
      use_sim_time: false
      min_height: 0.1
      max_height: 2.0
      angle_min: -3.14
      angle_max: 3.14
      angle_increment: 0.01
      scan_time: 0.1
      range_min: 0.3
      range_max: 50.0
      target_frame: os_lidar
      transform_tolerance: 0.1
      inf_epsilon: 1.0
      use_inf: true

  pointcloud_crop_box:
    ros__parameters:
      input_topic: <observation_topic>
      output_topic: <observation_topic>_filtered
      target_frame: <namespace>/base_link
      min_x: <min_x>
      max_x: <max_x>
      min_y: <min_y>
      max_y: <max_y>
      min_z: <min_z>
      max_z: <max_z>
      negative: true